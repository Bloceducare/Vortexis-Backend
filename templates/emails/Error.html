<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|default:"Action Error" }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #334155;
    }
    .wrapper {
      width: 100%;
      background-color: #0f172a;
      padding: 40px 0;
    }
    .main-table {
      background-color: #ffffff;
      margin: 0 auto;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background-color: #1e1b4b;
      padding: 30px;
      text-align: center;
      border-bottom: 2px solid #ef4444;
    }
    .brand-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      margin: 0;
    }
    .content {
      padding: 36px 40px;
    }
    .error-card {
      background-color: #fff1f2;
      border-left: 4px solid #e11d48;
      border-radius: 6px;
      padding: 16px 20px;
      margin: 20px 0;
      color: #881337;
    }
    .footer {
      background-color: #f8fafc;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="main-table" align="center" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="header">
          <div class="brand-title">VORTEXIS</div>
        </td>
      </tr>
      <tr>
        <td class="content">
          <h2 style="color: #0f172a; margin-top: 0;">{{ title|default:"Action Could Not Be Completed" }}</h2>
          <p style="color: #475569; font-size: 15px; line-height: 1.6;">
            Hi {{ user.first_name|default:user.username }},<br>
            {{ message }}
          </p>
          {% if reasons %}
          <div class="error-card">
            <strong>Details:</strong>
            <ul style="margin: 8px 0 0 0; padding-left: 20px;">
              {% for reason in reasons %}
                <li>{{ reason }}</li>
              {% endfor %}
            </ul>
          </div>
          {% endif %}
        </td>
      </tr>
      <tr>
        <td class="footer">
          &copy; Vortexis Platform. All rights reserved.
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
